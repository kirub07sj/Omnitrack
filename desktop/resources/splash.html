<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loading Omnitrack...</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #022c22 0%, #064e3b 100%);
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      color: white;
      -webkit-app-region: drag; /* Makes the window draggable */
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      max-width: 400px;
    }

    .logo-container {
      margin-bottom: 2rem;
      animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }

    .logo {
      width: 120px;
      height: auto;
      filter: drop-shadow(0 0 20px rgba(52, 211, 153, 0.4));
    }

    .brand-name {
      font-size: 24px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .status-text {
      font-size: 14px;
      color: #a7f3d0;
      opacity: 0.8;
      margin-bottom: 30px;
      font-weight: 500;
      letter-spacing: 0.5px;
    }

    .progress-bar-container {
      width: 200px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      width: 30%;
      background: #34d399; /* Emerald 400 */
      border-radius: 4px;
      animation: loading 2s infinite ease-in-out;
      box-shadow: 0 0 10px #34d399;
    }
    p {
      margin-top: 20px;
      font-size: 12px;
      color: #a7f3d0;
      opacity: 0.6;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.05); opacity: 0.8; }
    }

    @keyframes loading {
      0% { transform: translateX(-100%); width: 20%; }
      50% { width: 40%; }
      100% { transform: translateX(400%); width: 20%; }
    }

  </style>
</head>
<body>
  <div class="container">
    <div class="logo-container">
      <img src="logo.png" alt="Omnitrack Logo" class="logo" />
    </div>
    
    <div class="brand-name">Omnitrack</div>
    <div class="status-text" id="status">Initializing system...</div>
    
    <div class="progress-bar-container">
      <div class="progress-bar"></div>
    </div>
    <p>Powered by Lab Lynx</p>
  </div>

  <script>
    // Listen for status updates from the main process
    const { ipcRenderer } = require('electron');
    if (ipcRenderer) {
      ipcRenderer.on('loading-status', (event, message) => {
        document.getElementById('status').innerText = message;
      });
    }
  </script>
</body>
</html>
